<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Awesome Arrow Icon</title>
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <style>
        #custom_skin .arrow_down {
            position: relative;
            background-color: var(--color);
        }

        #custom_skin .arrow_down:after {
            font-family: "Font Awesome 5 Free";
            font-weight: 900;
            content: "\f0dd";
            position: absolute;
            right: 0px;
            top: 0px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div id="custom_skin" class="space-between">
        <div style="margin: 100px 100px 100px 100px">
            <h6 class="arrow_down">aaaaaaa</h6>
            sssss<br>
        </div>
    </div>
</body>
</html>
